experiment:
  name: fed_real_bed_p2_rc_quality
  seed: 2026
  device: auto
  deterministic: false

paths:
  bed_raw_root: ${BED_RAW_ROOT}
  manifest_csv:
  cache_root: artifacts/cache
  results_root: artifacts/results

data:
  input_sampling_rate: 256
  target_sampling_rate: 256
  channels: [AF3, F7, F3, FC5, T7, P7, O1, O2, P8, T8, FC6, F4, F8, AF4]
  stimulus: RC
  stimulus_group: resting
  window_sec: 2.0
  step_sec: 1.0
  bandpass_hz: [1.0, 45.0]
  notch_hz: 50.0
  zscore: channel
  quality:
    max_abs_uv: 150.0
    min_std_uv: 0.05
    max_std_uv: 80.0
    flatline_std_uv: 0.01
    max_bad_channel_frac: 0.25
    min_quality: 0.35

protocol:
  name: P2
  enroll_sessions: [r01, session1, s1, 1]
  validation_sessions: [r02, session2, s2, 2]
  test_sessions: [r03, session3, s3, 3]
  train_sessions: [r01, session1, s1, 1]
  threshold_source: validation

model:
  encoder: cnn_tcn
  emb_dim: 128
  num_subjects: 21
  dropout: 0.20
  width: 96
  tcn_blocks: 4
  transformer_layers: 2
  transformer_heads: 4

loss:
  classifier: adaface
  arcface_margin: 0.35
  arcface_scale: 30.0
  subcenters: 3
  supcon_weight: 0.25
  supcon_temperature: 0.07
  quality_margin_weight: 0.20

train:
  epochs: 80
  selection_metric: val_eer
  batch_size: 128
  lr: 0.0003
  weight_decay: 0.0001
  patience: 15
  num_workers: 4
  amp: true
  grad_clip: 5.0

verification:
  prototype: kmeans
  kmeans_k: 3
  score_norm: adaptive_snorm
  cohort_size: 100
  fusion:
    methods: [single, mean_5, mean_10, majority_5, majority_10]
  quality_rejection: true
  target_far: [0.01, 0.05, 0.10]

adaptation:
  methods: [none, bn_recalibration, prototype_ema]
  ema_alpha: 0.05

federated:
  enabled: false
  method: fedavg
  clients: subject
  rounds: 20
  local_epochs: 2
  client_fraction: 1.0
  fedprox_mu: 0.01
  personalize: true
