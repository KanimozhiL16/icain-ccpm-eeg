[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fed-real-bed"
version = "0.1.0"
description = "Research-grade real-time EEG biometric authentication pipeline for the BED dataset."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "torch>=2.1",
  "tqdm>=4.66",
  "matplotlib>=3.7",
  "pyyaml>=6.0",
  "joblib>=1.3",
]

[project.optional-dependencies]
raw-edf = ["mne>=1.6"]
api = ["fastapi>=0.110", "uvicorn>=0.27"]
dev = ["pytest>=8.0"]

[project.scripts]
fed-real-bed = "fed_real_bed.cli:main"

[tool.setuptools.packages.find]
include = ["fed_real_bed*"]

